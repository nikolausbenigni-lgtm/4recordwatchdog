<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="How a federal FOIA request moves" font-family="Arial, Helvetica, sans-serif"><title>How a federal FOIA request moves</title><rect width="800" height="320" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >How a federal FOIA request moves</text><line x1="90.0" y1="105" x2="710.0" y2="105" stroke="#cbd5e1" stroke-width="4"/><circle cx="90.0" cy="105" r="26" fill="#071638"/><text x="90.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="90.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Send request</text><text x="90.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Write to the FOIA</text><text x="90.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >officer. Be specific.</text><circle cx="245.0" cy="105" r="26" fill="#ff6f36"/><text x="245.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="245.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Agency responds</text><text x="245.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Generally within 20</text><text x="245.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >business days</text><text x="245.0" y="220" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >(delays are common)</text><circle cx="400.0" cy="105" r="26" fill="#071638"/><text x="400.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="400.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Decision</text><text x="400.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Released, partly</text><text x="400.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >released, or denied</text><circle cx="555.0" cy="105" r="26" fill="#ff6f36"/><text x="555.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="555.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Appeal</text><text x="555.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Use the deadline in</text><text x="555.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >the denial letter</text><circle cx="710.0" cy="105" r="26" fill="#071638"/><text x="710.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="710.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Next steps</text><text x="710.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >OGIS mediation or</text><text x="710.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >federal court</text><text x="400.0" y="282" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">State and local agencies follow their own state public records laws,</text><text x="400.0" y="302" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">which have different deadlines.</text></svg>