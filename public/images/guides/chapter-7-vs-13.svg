<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Chapter 7 vs. Chapter 13 at a glance" font-family="Arial, Helvetica, sans-serif"><title>Chapter 7 vs. Chapter 13 at a glance</title><rect width="800" height="440" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Chapter 7 vs. Chapter 13 at a glance</text><rect x="174" y="62" width="296.0" height="46" rx="12" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="1.5"/><text x="322.0" y="92" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Chapter 7</text><rect x="480.0" y="62" width="296.0" height="46" rx="12" fill="#7c4dd6" stroke="#7c4dd6" stroke-width="1.5"/><text x="628.0" y="92" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Chapter 13</text><rect x="24" y="118" width="752" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="150.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Purpose</text><text x="186" y="141.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Sells nonexempt assets to pay</text><text x="186" y="159.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >creditors, then discharges debts</text><text x="492.0" y="141.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Repays debts through a</text><text x="492.0" y="159.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >court-approved plan</text><rect x="24" y="180" width="752" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="208.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Your property</text><text x="186" y="208.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Trustee may sell nonexempt assets</text><text x="492.0" y="208.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >You generally keep your property</text><rect x="24" y="234" width="752" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="262.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >How long</text><text x="186" y="262.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >A few months</text><text x="492.0" y="262.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Three to five years</text><rect x="24" y="288" width="752" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="316.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Who qualifies</text><text x="186" y="316.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Must pass a means test</text><text x="492.0" y="316.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Regular income, within debt limits</text><rect x="24" y="342" width="752" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="370.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Credit report</text><text x="186" y="370.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Commonly up to 10 years</text><text x="492.0" y="370.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Commonly about 7 years</text><text x="400.0" y="416" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">General information, not legal advice. Rules and exceptions vary.</text></svg>