<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Which court records should you search" font-family="Arial, Helvetica, sans-serif"><title>Which court records should you search</title><rect width="800" height="380" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Which court records should you search?</text><rect x="290" y="62" width="220" height="54" rx="14" fill="#071638" stroke="#071638" stroke-width="1.5"/><text x="400" y="95" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Where was the case filed?</text><path d="M400,116 V140 H145 V172" fill="none" stroke="#cbd5e1" stroke-width="3"/><rect x="30" y="172" width="230" height="54" rx="14" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="1.5"/><text x="145" y="205" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >County or state court</text><line x1="145" y1="226" x2="145" y2="256" stroke="#cbd5e1" stroke-width="3"/><rect x="30" y="256" width="230" height="66" rx="14" fill="#fff" stroke="#2f5fd0" stroke-width="2.5"/><text x="145" y="285" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >County clerk or</text><text x="145" y="305" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >state court portal</text><line x1="400" y1="116" x2="400" y2="172" stroke="#cbd5e1" stroke-width="3"/><rect x="285" y="172" width="230" height="54" rx="14" fill="#7c4dd6" stroke="#7c4dd6" stroke-width="1.5"/><text x="400" y="205" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Federal court</text><line x1="400" y1="226" x2="400" y2="256" stroke="#cbd5e1" stroke-width="3"/><rect x="285" y="256" width="230" height="66" rx="14" fill="#fff" stroke="#7c4dd6" stroke-width="2.5"/><text x="400" y="285" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >PACER or</text><text x="400" y="305" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >CourtListener</text><path d="M400,116 V140 H655 V172" fill="none" stroke="#cbd5e1" stroke-width="3"/><rect x="540" y="172" width="230" height="54" rx="14" fill="#14916f" stroke="#14916f" stroke-width="1.5"/><text x="655" y="205" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Bankruptcy court</text><line x1="655" y1="226" x2="655" y2="256" stroke="#cbd5e1" stroke-width="3"/><rect x="540" y="256" width="230" height="66" rx="14" fill="#fff" stroke="#14916f" stroke-width="2.5"/><text x="655" y="295" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" >PACER Case Locator</text><text x="400.0" y="350" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Not sure? Start with the county where the event happened, then check PACER.</text></svg>