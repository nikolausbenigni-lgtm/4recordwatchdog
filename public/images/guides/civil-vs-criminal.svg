<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" role="img" aria-label="Civil and criminal cases compared" font-family="Arial, Helvetica, sans-serif"><title>Civil and criminal cases compared</title><rect width="800" height="425" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Civil and criminal cases compared</text><rect x="174" y="62" width="296.0" height="46" rx="12" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="1.5"/><text x="322.0" y="92" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Civil case</text><rect x="480.0" y="62" width="296.0" height="46" rx="12" fill="#7c4dd6" stroke="#7c4dd6" stroke-width="1.5"/><text x="628.0" y="92" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >Criminal case</text><rect x="24" y="118" width="752" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="150.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Who brings it</text><text x="186" y="141.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >A person or company</text><text x="186" y="159.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >(the plaintiff)</text><text x="492.0" y="141.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >The government</text><text x="492.0" y="159.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >(the prosecutor)</text><rect x="24" y="180" width="752" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="212.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Proof needed</text><text x="186" y="203.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Preponderance of</text><text x="186" y="221.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >the evidence</text><text x="492.0" y="203.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Beyond a</text><text x="492.0" y="221.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >reasonable doubt</text><rect x="24" y="242" width="752" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="274.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Possible result</text><text x="186" y="265.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Money damages or</text><text x="186" y="283.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >court orders</text><text x="492.0" y="265.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Fines, probation,</text><text x="492.0" y="283.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >or incarceration</text><rect x="24" y="304" width="752" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="336.0" font-size="15" font-weight="700" fill="#071638" text-anchor="start" >Typical records</text><text x="186" y="327.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Complaint, answer,</text><text x="186" y="345.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >judgment</text><text x="492.0" y="327.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >Charges, plea,</text><text x="492.0" y="345.0" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >sentence</text><text x="400.0" y="401" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">A claim or a charge is not a finding. Always read the final disposition.</text></svg>