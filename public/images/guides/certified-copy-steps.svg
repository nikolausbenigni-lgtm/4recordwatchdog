<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Ordering a certified copy" font-family="Arial, Helvetica, sans-serif"><title>Ordering a certified copy</title><rect width="800" height="320" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Ordering a certified copy</text><line x1="90.0" y1="105" x2="710.0" y2="105" stroke="#cbd5e1" stroke-width="4"/><circle cx="90.0" cy="105" r="26" fill="#071638"/><text x="90.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="90.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Find the office</text><text x="90.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >The office that holds</text><text x="90.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >the original record</text><circle cx="245.0" cy="105" r="26" fill="#ff6f36"/><text x="245.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="245.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Gather details</text><text x="245.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Case or document</text><text x="245.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >number, names, dates</text><circle cx="400.0" cy="105" r="26" fill="#071638"/><text x="400.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="400.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Choose a method</text><text x="400.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Online, mail,</text><text x="400.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >or in person</text><circle cx="555.0" cy="105" r="26" fill="#ff6f36"/><text x="555.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="555.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Pay the fees</text><text x="555.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Per-page copy fee plus</text><text x="555.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >a certification fee</text><circle cx="710.0" cy="105" r="26" fill="#071638"/><text x="710.0" y="111.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="710.0" y="158" font-size="16" font-weight="700" fill="#071638" text-anchor="middle" >Receive the copy</text><text x="710.0" y="182" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >Ask if an apostille</text><text x="710.0" y="201" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" >is also needed</text><text x="400.0" y="282" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Ask the agency that will receive the copy which kind of</text><text x="400.0" y="302" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">certification it requires and how recent it must be.</text></svg>