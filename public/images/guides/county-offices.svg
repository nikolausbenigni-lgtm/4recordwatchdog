<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Who keeps what in a county" font-family="Arial, Helvetica, sans-serif"><title>Who keeps what in a county</title><rect width="800" height="360" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Who keeps what in a county</text><rect x="24.0" y="72" width="176.0" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M24.0,132 V86 Q24.0,72 38.0,72 H186.0 Q200.0,72 200.0,86 V132 Z" fill="#2f5fd0"/><text x="112.0" y="108.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Clerk of Court</text><text x="38.0" y="160" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Filings and dockets</text><text x="38.0" y="181" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Judgments and orders</text><text x="38.0" y="202" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Lawsuits, divorces,</text><text x="38.0" y="223" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >and criminal cases</text><rect x="216.0" y="72" width="176.0" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M216.0,132 V86 Q216.0,72 230.0,72 H378.0 Q392.0,72 392.0,86 V132 Z" fill="#14916f"/><text x="304.0" y="97" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Recorder or</text><text x="304.0" y="117" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Register of Deeds</text><text x="230.0" y="160" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Deeds and mortgages</text><text x="230.0" y="181" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Liens and releases</text><text x="230.0" y="202" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Easements</text><text x="230.0" y="223" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >The land record index</text><rect x="408.0" y="72" width="176.0" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M408.0,132 V86 Q408.0,72 422.0,72 H570.0 Q584.0,72 584.0,86 V132 Z" fill="#7c4dd6"/><text x="496.0" y="108.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Assessor</text><text x="422.0" y="160" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Owner on the tax roll</text><text x="422.0" y="181" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Parcel number</text><text x="422.0" y="202" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Assessed value</text><text x="422.0" y="223" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Property details</text><rect x="600.0" y="72" width="176.0" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M600.0,132 V86 Q600.0,72 614.0,72 H762.0 Q776.0,72 776.0,86 V132 Z" fill="#c2410c"/><text x="688.0" y="97" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Treasurer or</text><text x="688.0" y="117" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Tax Collector</text><text x="614.0" y="160" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Tax bills</text><text x="614.0" y="181" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Payments made</text><text x="614.0" y="202" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Delinquent amounts</text><text x="614.0" y="223" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Tax sale status</text><text x="400.0" y="320" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Office names differ by state. Search by the record you need, not the title.</text></svg>