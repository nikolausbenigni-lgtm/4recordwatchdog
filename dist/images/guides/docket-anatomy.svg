<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Anatomy of a court docket with date, entry number and description" font-family="Arial, Helvetica, sans-serif"><title>Anatomy of a court docket with date, entry number and description</title><rect width="800" height="340" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >Anatomy of a docket</text><rect x="30" y="62" width="740" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="62" width="740" height="38" rx="12" fill="#071638" stroke="#071638" stroke-width="1.5"/><text x="46" y="87" font-size="14" font-weight="700" fill="#fff" text-anchor="start" >Date filed</text><text x="176" y="87" font-size="14" font-weight="700" fill="#fff" text-anchor="start" >#</text><text x="236" y="87" font-size="14" font-weight="700" fill="#fff" text-anchor="start" >Docket text</text><rect x="31" y="100" width="738" height="50" fill="#f1f5f9"/><text x="46" y="131" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >01/15/2025</text><text x="176" y="131" font-size="14" font-weight="700" fill="#ff6f36" text-anchor="start" >1</text><text x="236" y="131" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >COMPLAINT filed by Plaintiff against Defendant.</text><text x="46" y="181" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >01/22/2025</text><text x="176" y="181" font-size="14" font-weight="700" fill="#ff6f36" text-anchor="start" >2</text><text x="236" y="181" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >SUMMONS issued as to Defendant.</text><rect x="31" y="200" width="738" height="50" fill="#f1f5f9"/><text x="46" y="231" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >02/20/2025</text><text x="176" y="231" font-size="14" font-weight="700" fill="#ff6f36" text-anchor="start" >3</text><text x="236" y="231" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" >ANSWER to Complaint filed by Defendant.</text><line x1="100" y1="252" x2="100" y2="276" stroke="#ff6f36" stroke-width="2.5"/><text x="100" y="296" font-size="14" font-weight="700" fill="#071638" text-anchor="middle" >Date filed</text><line x1="190" y1="252" x2="190" y2="276" stroke="#ff6f36" stroke-width="2.5"/><text x="190" y="296" font-size="14" font-weight="700" fill="#071638" text-anchor="middle" >Entry number</text><line x1="500" y1="252" x2="500" y2="276" stroke="#ff6f36" stroke-width="2.5"/><text x="500" y="296" font-size="14" font-weight="700" fill="#071638" text-anchor="middle" >Short description written by court staff</text><text x="400.0" y="322" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Example only. Not a real case.</text></svg>