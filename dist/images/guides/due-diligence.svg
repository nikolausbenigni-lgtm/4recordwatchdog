<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="A due diligence checklist for a business partner" font-family="Arial, Helvetica, sans-serif"><title>A due diligence checklist for a business partner</title><rect width="800" height="410" rx="18" fill="#ffffff"/><text x="400.0" y="40" font-size="22" font-weight="700" fill="#071638" text-anchor="middle" >A due diligence checklist for a business partner</text><rect x="24.0" y="72" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M24.0,120 V86 Q24.0,72 38.0,72 H250.0 Q264.0,72 264.0,86 V120 Z" fill="#2f5fd0"/><text x="144.0" y="102.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >1. Entity status</text><text x="38.0" y="148" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Secretary of State</text><text x="38.0" y="169" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >records</text><rect x="280.0" y="72" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M280.0,120 V86 Q280.0,72 294.0,72 H506.0 Q520.0,72 520.0,86 V120 Z" fill="#7c4dd6"/><text x="400.0" y="102.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >2. Liens and UCC</text><text x="294.0" y="148" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >Who has a claim</text><text x="294.0" y="169" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >on the assets?</text><rect x="536.0" y="72" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M536.0,120 V86 Q536.0,72 550.0,72 H762.0 Q776.0,72 776.0,86 V120 Z" fill="#14916f"/><text x="656.0" y="102.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >3. Court cases</text><text x="550.0" y="148" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >County, state, and</text><text x="550.0" y="169" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >federal dockets</text><rect x="24.0" y="218" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M24.0,266 V232 Q24.0,218 38.0,218 H250.0 Q264.0,218 264.0,232 V266 Z" fill="#c2410c"/><text x="144.0" y="248.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >4. Bankruptcy</text><text x="38.0" y="294" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >PACER Case Locator</text><text x="38.0" y="315" font-size="14" font-weight="400" fill="#475569" text-anchor="start" ></text><rect x="280.0" y="218" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M280.0,266 V232 Q280.0,218 294.0,218 H506.0 Q520.0,218 520.0,232 V266 Z" fill="#2f5fd0"/><text x="400.0" y="248.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >5. Licenses</text><text x="294.0" y="294" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >State board records</text><text x="294.0" y="315" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >and any discipline</text><rect x="536.0" y="218" width="240.0" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M536.0,266 V232 Q536.0,218 550.0,218 H762.0 Q776.0,218 776.0,232 V266 Z" fill="#7c4dd6"/><text x="656.0" y="248.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >6. Sanctions lists</text><text x="550.0" y="294" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >OFAC and SAM.gov</text><text x="550.0" y="315" font-size="14" font-weight="400" fill="#475569" text-anchor="start" >exclusion lists</text><text x="400.0" y="370" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Keep a dated log of each check and where you found it.</text></svg>